plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// `./gradlew runClientGameTest` starts the game, runs src/gametest and quits.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'trollingofundying-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

loom {
    runs.matching { it.name == 'clientGameTest' }.configureEach {
        vmArg "-Dtrollingofundying.captureDir=${file('run/totem_capture').absolutePath}"
    }
    // Keeps "Minecraft" out of the game test window's title (see MinecraftMixin).
    runs.matching { it.name == 'clientGameTest' }.configureEach {
        vmArg '-Dtrollingofundying.windowTitle=TrollingOfUndying'
    }
}
